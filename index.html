<style>
:root{--bg:#e9ebee;--card:#f6f7f8;--ink:#20262d;--mut:#6b7580;--line:#d3d8dd;--acc:#3f6570;--acc2:#8a7a5c;--bad:#a4514a;--ok:#4c7a5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f24;--card:#242a31;--ink:#e3e7ea;--mut:#8b96a1;--line:#343c45;--acc:#7fa3ae;--acc2:#b3a37f;--bad:#c9776f;--ok:#7fae90}}
:root[data-theme="dark"]{--bg:#1b1f24;--card:#242a31;--ink:#e3e7ea;--mut:#8b96a1;--line:#343c45;--acc:#7fa3ae;--acc2:#b3a37f;--bad:#c9776f;--ok:#7fae90}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
nav .badge{background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:5px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input[type=search]{max-width:280px}
.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-weight:600}
.stat span{color:var(--mut);font-size:12.5px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--mut);font-size:13px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.nm{font-weight:500}.ds{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}
.low{color:var(--bad);font-weight:600}.ok{color:var(--ok)}
.st{display:inline-flex;align-items:center;gap:4px}
.st button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px}
.st input{width:58px;text-align:center;padding:5px}
.mi{width:64px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;font-size:26px;line-height:1;background:var(--acc);color:#fff;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:18px;width:min(420px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:17px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:12.5px;color:var(--mut)}
.f .w{grid-column:1/-1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
@media(max-width:760px){.charts{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(90px,140px) 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.row .t{height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--acc);border-radius:3px}
.row.w .t i{background:var(--acc2)}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;padding:16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;width:min(320px,100%);display:grid;gap:10px}
.login h2{margin:0;font-size:18px}.err{color:var(--bad);font-size:13px;min-height:18px}
.warn{background:var(--card);border:1px solid var(--acc2);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.cart-scroll{max-height:32vh;overflow-y:auto}
.cart-search-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.cart-search-item:last-child{border-bottom:0}
.cart-search-item .ds{margin-top:1px}
.cart-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.cart-item:last-child{border-bottom:0}
.cart-item .nm{flex:1;min-width:0}
.cart-item input[type=number]{width:52px;text-align:center;padding:5px;flex:none}
.cart-diff{width:60px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;flex:none}
.cart-head{display:flex;gap:6px;color:var(--mut);font-size:12.5px;padding-bottom:4px}
.cart-head span{flex:none}
.cart-head span:first-child{flex:1}
.cart-empty{color:var(--mut);font-size:13px;padding:8px 0}
.cart-tot{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.cart-tot span{color:var(--mut);font-size:13px}
.footer-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
@media (max-width:600px){
  .tw{overflow-x:visible}
  table{min-width:0;width:100%}
  thead{display:none}
  tbody{display:block}
  tr{display:block;padding:10px 12px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{display:block;padding:3px 0;border-bottom:0;text-align:left}
  td:first-child{padding-bottom:6px}
  td:last-child{padding-top:6px}
  td[data-label]{display:flex;justify-content:space-between;align-items:center;gap:10px}

<script>

const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₾';
let S={items:[],sales:[]},tab='main',q='',metric='qty';

function seed(){
  const d=n=>Date.now()-n*864e5;
  S.items=[
    {id:1,name:'Перья вилки (пара)',cat:'Подвеска',desc:'Комплект, 41 мм',buy:70,sell:115,stock:10,min:4},
    {id:2,name:'Тормозные колодки передние',cat:'Тормоза',desc:'Керамика, универсальные',buy:18,sell:32,stock:14,min:6},
    {id:3,name:'Цепь 520 x 114',cat:'Трансмиссия',desc:'O-ring, усиленная',buy:60,sell:95,stock:5,min:3},
    {id:4,name:'Звезда ведущая 15Т',cat:'Трансмиссия',desc:'Сталь, под цепь 520',buy:22,sell:38,stock:9,min:4},
    {id:5,name:'Масло моторное 10W-40, 1 л',cat:'Расходники',desc:'Полусинтетика',buy:14,sell:22,stock:30,min:12},
    {id:6,name:'Масляный фильтр',cat:'Расходники',desc:'Универсальный, картриджный',buy:6,sell:12,stock:22,min:10},

    {id:9,name:'Перчатки мото',cat:'Экипировка',desc:'Кожа, летние',buy:35,sell:58,stock:11,min:5},
    {id:10,name:'Покрышка 90/90-17',cat:'Резина',desc:'Дорожная, универсальная',buy:95,sell:150,stock:1,min:3},
    {id:11,name:'Аккумулятор 12В 7Ач',cat:'Электрика',desc:'Гелевый, необслуживаемый',buy:65,sell:100,stock:6,min:3},
    {id:12,name:'Лампа фары H4',cat:'Электрика',desc:'12В 60/55Вт',buy:5,sell:10,stock:0,min:6},
    {id:13,name:'Тросик газа',cat:'Тросы и кабели',desc:'Универсальный, 1200 мм',buy:8,sell:15,stock:13,min:5},
    {id:14,name:'Зеркало заднего вида',cat:'Кузов',desc:'Пара, круглые',buy:12,sell:22,stock:8,min:4},
    {id:15,name:'Сайлентблок маятника',cat:'Подвеска',desc:'Резинометаллический',buy:10,sell:19,stock:16,min:6}
  ];
  const P=[[1,3,4],[1,2,9],[2,10,3],[2,4,7],[3,2,2],[4,3,6],[5,12,1],[5,6,5],[6,8,3],[7,20,10],
    [8,1,6],[9,4,2],[9,3,14],[10,4,1],[11,2,8],[12,15,3],[12,6,16],[13,3,12],[14,2,5],[15,5,9],
    [3,1,20],[6,5,25],[9,2,18],[13,4,30],[5,8,15]];
  S.sales=P.map(([id,qty,ago],i)=>{
    const it=S.items.find(x=>x.id===id);return{id:i+1,item:id,qty,price:it.sell,buy:it.buy,t:d(ago)}});
}let ref=null,unsub=null;const ON=!!FB.apiKey;
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}seed()}
function save(){if(ref){ref.set(S).catch(()=>toast('Не удалось сохранить в Firebase'));return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const sold=id=>S.sales.filter(s=>s.item===id).reduce((a,s)=>a+s.qty,0);
const need=()=>S.items.filter(i=>i.stock<=i.min);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1800)}
function nid(a){return a.reduce((m,x)=>Math.max(m,x.id),0)+1}

function nav(){
  const T=[['main','Склад'],['stock','Остатки'],['order','Заказать'],['sales','Продажи']];
  $('#nav').innerHTML=T.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}${k==='order'&&need().length?`<span class="badge">${need().length}</span>`:''}</button>`).join('');
}
function match(i){const s=q.toLowerCase();return !s||(i.name+i.cat+i.desc).toLowerCase().includes(s)}
function search(){return `<div class="bar"><input type="search" id="q" placeholder="Поиск по названию или категории" value="${esc(q)}"><span class="sp"></span></div>`}
function filterItems(qq){const s=(qq||'').toLowerCase();return S.items.filter(i=>!s||(i.name+i.cat+i.desc).toLowerCase().includes(s))}

let cart=[],cartQ='';
function addToCart(id){
  const it=S.items.find(x=>x.id===id);if(!it||it.stock<1)return;
  const line=cart.find(c=>c.id===id);
  if(line){if(line.qty<it.stock)line.qty++}
  else cart.push({id,qty:1,price:it.sell});
  renderCartUI();
}
function removeFromCart(id){cart=cart.filter(c=>c.id!==id);renderCartUI()}
function setCartQty(id,val){const it=S.items.find(x=>x.id===id),line=cart.find(c=>c.id===id);if(!it||!line)return;
  line.qty=Math.max(1,Math.min(it.stock,Math.round(+val)||1));renderCartUI()}
function setCartPrice(id,val){const line=cart.find(c=>c.id===id);if(!line)return;line.price=Math.max(0,+val||0);renderCartUI()}
function buildCartHtml(){
  const results=filterItems(cartQ).slice(0,8);
  const totQty=cart.reduce((a,c)=>a+c.qty,0);
  const totProfit=cart.reduce((a,c)=>{const it=S.items.find(x=>x.id===c.id);return a+(it?(c.price-it.buy)*c.qty:0)},0);
  return `<h2>Продажа</h2>
  <input type="search" id="cartQ" placeholder="Найти товар и добавить" value="${esc(cartQ)}">
  <div class="cart-scroll" style="margin-top:10px">
  ${results.length?results.map(i=>{const inCart=cart.find(c=>c.id===i.id),left=i.stock-(inCart?inCart.qty:0);
    return `<div class="cart-search-item"><div class="nm">${esc(i.name)}<div class="ds">${esc(i.cat||'Без категории')} · в наличии ${i.stock}</div></div>
    <button type="button" class="btn sm" data-cartadd="${i.id}" ${left<1?'disabled':''}>Добавить</button></div>`}).join(''):'<div class="cart-empty">Ничего не найдено.</div>'}
  </div>
  ${cart.length?`<div class="cart-head"><span>Товар</span><span style="width:52px;text-align:center">Кол-во</span><span style="width:52px;text-align:center">Цена</span><span style="width:60px;text-align:right">Разница</span><span style="width:22px"></span></div>
  <div class="cart-scroll">
  ${cart.map(c=>{const it=S.items.find(x=>x.id===c.id);if(!it)return'';const diff=(c.price-it.buy)*c.qty;
    return `<div class="cart-item"><div class="nm">${esc(it.name)}<div class="ds">закупка ${fmt(it.buy)}/шт.</div></div>
    <input type="number" min="1" max="${it.stock}" value="${c.qty}" data-cartqty="${c.id}">
    <input type="number" min="0" value="${c.price}" data-cartprice="${c.id}">
    <span class="cart-diff ${diff<0?'low':'ok'}">${diff>=0?'+':''}${fmt(diff)}</span>
    <button type="button" class="btn ghost sm" data-cartdel="${c.id}" aria-label="Убрать">×</button></div>`}).join('')}
  </div>
  <div class="cart-tot"><span>Итого ${totQty} шт.</span><b class="${totProfit<0?'low':'ok'}">${totProfit>=0?'+':''}${fmt(totProfit)}</b></div>`:''}
  <div class="acts"><button type="button" class="btn ghost" data-close>Отмена</button><button class="btn" ${cart.length?'':'disabled'}>Записать продажу${cart.length?' ('+cart.length+')':''}</button></div>`;
}
function renderCartUI(){$('#fCart').innerHTML=buildCartHtml()}
function cartForm(){
  cart=[];cartQ='';
  renderCartUI();
  $('#dCart').showModal();
  $('#fCart').onsubmit=e=>{e.preventDefault();confirmCart()};
}
function confirmCart(){
  if(!cart.length)return;
  let totProfit=0;
  cart.forEach(c=>{const it=S.items.find(x=>x.id===c.id);if(!it)return;
    const qty=Math.max(1,Math.min(it.stock,Math.round(c.qty)||1));
    it.stock-=qty;totProfit+=(c.price-it.buy)*qty;
    S.sales.push({id:nid(S.sales),item:c.id,qty,price:c.price,buy:it.buy,t:Date.now()})});
  save();$('#dCart').close();render();
  toast('Продажа записана, прибыль '+(totProfit>=0?'+':'')+fmt(totProfit));
}

function plural(n,one,few,many){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return many;if(n1>1&&n1<5)return few;if(n1===1)return one;return many}
function vMain(){
  const L=S.items.filter(match);
  const nd=need().length;
  return `${nd?`<div class="warn">${nd} ${plural(nd,'товар заканчивается','товара заканчиваются','товаров заканчивается')} — смотрите вкладку «Заказать».</div>`:''}
  ${search()}
  <div class="tw"><table><thead><tr><th>Товар</th><th class="n">Остаток</th><th class="n">Закупка</th><th class="n">Продажа</th><th class="n">Продано</th><th></th></tr></thead><tbody>
  ${L.map(i=>`<tr><td><div class="nm">${esc(i.name)}</div><div class="ds"><span class="tag">${esc(i.cat||'Без категории')}</span> ${esc(i.desc)}</div></td>
  <td class="n ${i.stock<=i.min?'low':''}" data-label="Остаток">${i.stock}</td><td class="n" data-label="Закупка">${fmt(i.buy)}</td><td class="n" data-label="Продажа">${fmt(i.sell)}</td><td class="n" data-label="Продано">${sold(i.id)}</td>
  <td class="n" style="white-space:nowrap"><button class="btn sm" data-sell="${i.id}" ${i.stock<1?'disabled':''}>Продано</button> <button class="btn ghost sm" data-edit="${i.id}">Изм.</button></td></tr>`).join('')||''}
  </tbody></table>${L.length?'':'<div class="empty">Ничего не найдено. Нажмите «+», чтобы добавить товар.</div>'}</div>`;
}
function vStock(){
  const L=S.items.filter(match);
  return `${search()}<div class="tw"><table><thead><tr><th>Товар</th><th>Остаток, шт.</th><th class="n">Минимум</th><th>Статус</th></tr></thead><tbody>
  ${L.map(i=>`<tr><td><div class="nm">${esc(i.name)}</div><div class="ds">${esc(i.cat)}</div></td>
  <td data-label="Остаток, шт."><span class="st"><button data-d="${i.id}:-1" aria-label="Минус">−</button><input type="number" min="0" value="${i.stock}" data-set="${i.id}:stock"><button data-d="${i.id}:1" aria-label="Плюс">+</button></span></td>
  <td class="n" data-label="Минимум"><input class="mi" type="number" min="0" value="${i.min}" data-set="${i.id}:min"></td>
  <td data-label="Статус">${i.stock<=i.min?'<span class="low">Заказать</span>':'<span class="ok">В норме</span>'}</td></tr>`).join('')}
  </tbody></table>${L.length?'':'<div class="empty">Нет товаров.</div>'}</div>`;
}
function vOrder(){
  const L=need();
  if(!L.length)return '<div class="tw"><div class="empty">Всё в порядке: ни один товар не опустился до минимума.</div></div>';
  const tot=L.reduce((a,i)=>a+(Math.max(i.min*2-i.stock,1))*i.buy,0);
  return `<div class="bar"><span class="ds">Рекомендуемое количество — до двойного минимума. Сумма закупки: <b>${fmt(tot)}</b></span><span class="sp"></span><button class="btn ghost sm" id="copy">Скопировать список</button></div>
  <div class="tw"><table><thead><tr><th>Товар</th><th class="n">Сейчас</th><th class="n">Минимум</th><th class="n">Заказать</th><th></th></tr></thead><tbody>
  ${L.map(i=>{const n=Math.max(i.min*2-i.stock,1);return `<tr><td><div class="nm">${esc(i.name)}</div><div class="ds">${esc(i.cat)}</div></td>
  <td class="n low" data-label="Сейчас">${i.stock}</td><td class="n" data-label="Минимум">${i.min}</td><td class="n" data-label="Заказать"><b>${n}</b></td>
  <td class="n"><button class="btn sm" data-recv="${i.id}:${n}">Поступило</button></td></tr>`}).join('')}</tbody></table></div>`;
}
function agg(keyFn){
  const m={};S.sales.forEach(s=>{const it=S.items.find(x=>x.id===s.item);if(!it)return;const k=keyFn(it);
    m[k]=m[k]||{qty:0,rev:0,profit:0};m[k].qty+=s.qty;m[k].rev+=s.qty*s.price;m[k].profit+=s.qty*(s.price-s.buy)});
  return Object.entries(m).map(([k,v])=>({k,...v})).sort((a,b)=>b[metric]-a[metric]);
}
function bars(data,cls){
  if(!data.length)return '<div class="ds">Продаж пока нет.</div>';
  const mx=Math.max(...data.map(d=>d[metric]),1);
  return data.map(d=>`<div class="row ${cls||''}"><span title="${esc(d.k)}">${esc(d.k)}</span><div class="t"><i style="width:${Math.max(d[metric]/mx*100,2)}%"></i></div><span>${metric==='qty'?d.qty+' шт.':fmt(d[metric])}</span></div>`).join('');
}
function vSales(){
  const byI=agg(i=>i.name),byC=agg(i=>i.cat||'Без категории');
  const tq=S.sales.reduce((a,s)=>a+s.qty,0),tr=S.sales.reduce((a,s)=>a+s.qty*s.price,0),tp=S.sales.reduce((a,s)=>a+s.qty*(s.price-s.buy),0);
  const cost=S.items.reduce((a,i)=>a+i.buy*i.stock,0),ret=S.items.reduce((a,i)=>a+i.sell*i.stock,0);
  const last=[...S.sales].sort((a,b)=>b.t-a.t).slice(0,8);
  const M=[['qty','Штуки'],['rev','Выручка'],['profit','Прибыль']];
  return `<div class="stats"><div class="stat"><b>${tq}</b><span>продано, шт.</span></div><div class="stat"><b>${fmt(tr)}</b><span>выручка</span></div>
  <div class="stat"><b>${fmt(tp)}</b><span>прибыль</span></div><div class="stat"><b>${fmt(cost)}</b><span>склад по закупке</span></div>
  <div class="stat"><b>${fmt(ret)}</b><span>склад по продаже</span></div></div>
  <div class="bar"><div class="seg">${M.map(([k,l])=>`<button class="${metric===k?'on':''}" data-m="${k}">${l}</button>`).join('')}</div></div>
  <div class="charts"><div class="panel"><h3>По товарам</h3>${bars(byI)}</div>
  <div style="display:grid;gap:14px;align-content:start"><div class="panel"><h3>По категориям</h3>${bars(byC,'w')}</div>
  <div class="panel"><h3>Последние продажи</h3>${last.map(s=>{const it=S.items.find(x=>x.id===s.item);return `<div class="row" style="grid-template-columns:1fr auto"><span>${esc(it?it.name:'Удалён')} × ${s.qty}</span><span class="ds">${new Date(s.t).toLocaleDateString('ru-RU')}</span></div>`}).join('')||'<div class="ds">Пока пусто.</div>'}</div></div></div>
  <div class="footer-actions">
    <button class="btn ghost sm" id="exp">Скачать резервную копию</button>
    <label class="btn ghost sm" id="imp" style="cursor:pointer">Восстановить<input type="file" id="file" accept=".json" hidden></label>
    <button class="btn ghost sm" id="out">Выйти</button>
  </div>`;
}
function render(){
  nav();
  $('#v').innerHTML={main:vMain,stock:vStock,order:vOrder,sales:vSales}[tab]();
  const qi=$('#q');if(qi&&document.activeElement===document.body&&q){}
  const f=$('#fab');
  if(tab==='stock'){f.textContent='+';f.title='Добавить товар';f.setAttribute('aria-label','Добавить товар')}
  else{f.textContent='₾';f.title='Новая продажа';f.setAttribute('aria-label','Новая продажа')}
}

function itemForm(id){
  const i=S.items.find(x=>x.id===id)||{name:'',cat:'',desc:'',buy:'',sell:'',stock:0,min:0};
  $('#fItem').innerHTML=`<h2>${id?'Изменить товар':'Новый товар'}</h2><div class="f">
  <label class="w">Название<input name="name" required value="${esc(i.name)}"></label>
  <label>Категория<input name="cat" list="cats" value="${esc(i.cat)}"></label>
  <datalist id="cats">${[...new Set(S.items.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>Описание<input name="desc" value="${esc(i.desc)}"></label>
  <label>Цена закупки, ₾<input name="buy" type="number" min="0" required value="${i.buy}"></label>
  <label>Цена продажи, ₾<input name="sell" type="number" min="0" required value="${i.sell}"></label>
  <label>В наличии, шт.<input name="stock" type="number" min="0" value="${i.stock}"></label>
  <label>Минимальный остаток<input name="min" type="number" min="0" value="${i.min}"></label></div>
  <div class="acts">${id?'<button type="button" class="btn ghost" id="del" style="margin-right:auto;color:var(--bad)">Удалить</button>':''}<button type="button" class="btn ghost" data-close>Отмена</button><button class="btn" value="ok">Сохранить</button></div>`;
  $('#dItem').showModal();
  $('#fItem').onsubmit=e=>{e.preventDefault();const f=new FormData($('#fItem')),v=Object.fromEntries(f);
    const o={name:v.name.trim(),cat:v.cat.trim(),desc:v.desc.trim(),buy:+v.buy,sell:+v.sell,stock:+v.stock||0,min:+v.min||0};
    if(id)Object.assign(S.items.find(x=>x.id===id),o);else S.items.push({id:nid(S.items),...o});
    save();$('#dItem').close();render();toast('Сохранено')};
  const d=$('#del');if(d)d.onclick=()=>{if(confirm('Удалить товар? История продаж по нему останется в статистике.')){S.items=S.items.filter(x=>x.id!==id);save();$('#dItem').close();render()}};
}
function sellForm(id){
  const i=S.items.find(x=>x.id===id);
  $('#fSell').innerHTML=`<h2>Продано: ${esc(i.name)}</h2><div class="f">
  <label>Количество (есть ${i.stock})<input name="qty" type="number" min="1" max="${i.stock}" value="1" required></label>
  <label>Цена за шт., ₾<input name="price" type="number" min="0" value="${i.sell}" required></label></div>
  <div class="acts"><button type="button" class="btn ghost" data-close>Отмена</button><button class="btn">Записать продажу</button></div>`;
  $('#dSell').showModal();
  $('#fSell').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData($('#fSell')));
    const n=Math.min(+v.qty,i.stock);if(n<1)return;
    i.stock-=n;S.sales.push({id:nid(S.sales),item:id,qty:n,price:+v.price,buy:i.buy,t:Date.now()});
    save();$('#dSell').close();render();toast('Продажа записана, остаток '+i.stock)};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;q='';render();return}
  if(t.dataset.close!==undefined){t.closest('dialog').close();return}
  if(t.dataset.sell)return sellForm(+t.dataset.sell);
  if(t.dataset.edit)return itemForm(+t.dataset.edit);
  if(t.dataset.m){metric=t.dataset.m;render();return}
  if(t.dataset.d){const[id,d]=t.dataset.d.split(':');const i=S.items.find(x=>x.id==id);i.stock=Math.max(0,i.stock+ +d);save();render();return}
  if(t.dataset.recv){const[id,n]=t.dataset.recv.split(':');const i=S.items.find(x=>x.id==id);i.stock+=+n;save();render();toast('Остаток обновлён: '+i.stock);return}
  if(t.id==='copy'){const txt=need().map(i=>`${i.name} — ${Math.max(i.min*2-i.stock,1)} шт.`).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Список скопирован')).catch(()=>prompt('Скопируйте список:',txt));return}
  if(t.dataset.cartadd){addToCart(+t.dataset.cartadd);return}
  if(t.dataset.cartdel){removeFromCart(+t.dataset.cartdel);return}
  if(t.id==='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='moto-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();return}
  if(t.id==='out'){localStorage.removeItem(PKEY);location.reload();return}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.cartqty){setCartQty(+e.target.dataset.cartqty,e.target.value);return}
  if(e.target.dataset.cartprice){setCartPrice(+e.target.dataset.cartprice,e.target.value);return}
  if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items)||!Array.isArray(d.sales))throw 0;if(!confirm('Заменить все текущие данные данными из файла?'))return;S=d;save();render();toast('Данные загружены')}catch(x){toast('Файл не подошёл')}};r.readAsText(f);return}
  const s=e.target.dataset.set;if(!s)return;const[id,f]=s.split(':');const i=S.items.find(x=>x.id==id);
  i[f]=Math.max(0,+e.target.value||0);save();render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
  if(e.target.id==='cartQ'){cartQ=e.target.value;const p=e.target.selectionStart;renderCartUI();const n=$('#cartQ');n.focus();n.setSelectionRange(p,p)}
});
$('#fab').onclick=()=>{tab==='stock'?itemForm(null):cartForm()};
const PKEY='moto_unlocked_v1';
function startApp(){
  $('#login').hidden=true;
  if(ON){try{firebase.initializeApp(FB);ref=firebase.firestore().collection('shop').doc('state')}catch(e){ref=null}}
  if(!ref){$('#warn').hidden=false;load();render();return}
  render();
  unsub=ref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists)S=snap.data();else{seed();ref.set(S)}
    render()},()=>{$('#warn').hidden=false;toast('Нет доступа к данным: проверьте правила Firestore')});
}
if(localStorage.getItem(PKEY)==='yes')startApp();
else{
  $('#login').hidden=false;$('#pw').focus();
  $('#fLogin').onsubmit=e=>{e.preventDefault();
    if($('#pw').value===APP_PASSWORD){localStorage.setItem(PKEY,'yes');startApp()}
    else{$('#lerr').textContent='Неверный пароль, попробуйте ещё раз';$('#pw').value='';$('#pw').focus()}};
}
</script>
</body>
</html>
